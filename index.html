<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloWorldv3 · 게시물</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 28px 16px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 22px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .post-card:hover {
      transform: translateY(-2px);
      border-color: #cbd5e1;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .post-tag {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .post-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .post-title a {
      color: var(--text);
      text-decoration: none;
    }

    .post-title a:hover {
      color: var(--primary);
    }

    .post-excerpt {
      color: var(--text-muted);
      font-size: 0.93rem;
      margin-bottom: 14px;
    }

    .post-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .post-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>게시물</h1>
      <p>주요 도구 및 게시물 모음</p>
    </header>

    <main class="post-list">
      <article class="post-card">
        <div class="post-meta">
          <span class="post-tag">도구</span>
          <span>QR 만들기·읽기</span>
        </div>
        <h2 class="post-title">
          <a href="./qr/">QR 만들기·읽기 웹앱 바로가기</a>
        </h2>
        <p class="post-excerpt">
          웹 주소, 와이파이, 전화번호, 이메일, 메모를 QR 코드로 생성하고 카메라 스캔·이미지 파일·붙여넣기로 QR 코드를 읽을 수 있습니다.
        </p>
        <a class="post-link" href="./qr/">게시물 열기 →</a>
      </article>
    </main>
  </div>
</body>
</html>
